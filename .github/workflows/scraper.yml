name: Daily Job Scraper

on:
  schedule:
    - cron: '30 0 * * *' # 06:00 IST daily
  workflow_dispatch:

jobs:
  scrape:
    name: Run Scraper & Ingest Jobs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm --filter @winter-arc/shared build && pnpm --filter @winter-arc/scraper build

      - name: Execute Scraper
        run: pnpm --filter @winter-arc/scraper run scrape
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || 'winter-arc-c2def' }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          OWNER_UID: ${{ secrets.OWNER_UID || 'ORosUow0nbPZvzQH823KFdree5v2' }}
          OWNER_EMAIL: sanjaysurya3010@gmail.com
