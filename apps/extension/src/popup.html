<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Winter Arc Autofill</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 380px;
      background-color: #0A0B10;
      color: #E7EAF3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.4;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-icon {
      width: 24px;
      height: 24px;
      background-color: #6D001A;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      color: #FFF;
    }
    .brand-title {
      font-size: 14px;
      font-weight: 600;
      color: #FFFFFF;
      letter-spacing: -0.01em;
    }
    .badge {
      font-size: 10px;
      font-family: monospace;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(109, 0, 26, 0.3);
      color: #FF4D73;
      border: 1px solid rgba(109, 0, 26, 0.5);
    }
    .autofill-btn {
      width: 100%;
      background: #6D001A;
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(109, 0, 26, 0.4);
      transition: all 0.2s ease;
    }
    .autofill-btn:hover {
      background: #8B0022;
      box-shadow: 0 6px 20px rgba(109, 0, 26, 0.6);
      transform: translateY(-1px);
    }
    .autofill-btn:active {
      transform: translateY(0);
    }
    .shortcut-hint {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.5);
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 5px;
      border-radius: 4px;
      font-family: monospace;
    }
    .status-box {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      background: #12141C;
      border: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 11px;
      color: #A1A1AA;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #10B981;
    }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #71717A;
      margin: 16px 0 8px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .form-group.full {
      grid-column: span 2;
    }
    label {
      font-size: 11px;
      color: #A1A1AA;
      font-weight: 500;
    }
    input, select, textarea {
      width: 100%;
      background: #12141C;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: #FFF;
      font-size: 12px;
      padding: 6px 8px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #7DD3FC;
    }
    .save-btn {
      width: 100%;
      margin-top: 14px;
      background: #1E212D;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #FFF;
      border-radius: 8px;
      padding: 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .save-btn:hover {
      background: #282C3B;
    }
    .footer-links {
      margin-top: 12px;
      text-align: center;
      font-size: 11px;
    }
    .footer-links a {
      color: #7DD3FC;
      text-decoration: none;
    }
    .footer-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <div class="brand-title">Winter Arc Autofill</div>
    </div>
    <span class="badge">V1.0</span>
  </div>

  <!-- Primary One-Click Action -->
  <button id="autofill-btn" class="autofill-btn" type="button">
    <span>⚡ Autofill This Page</span>
    <span class="shortcut-hint">Alt+Shift+F</span>
  </button>

  <div id="status-box" class="status-box">
    <div class="status-indicator">
      <div id="status-dot" class="status-dot"></div>
      <span id="status-text">Ready to fill forms on this tab</span>
    </div>
  </div>

  <!-- Profile Details Section -->
  <div class="section-title">
    <span>Master Profile</span>
    <span style="font-size: 10px; color: #10B981; font-weight: normal;">Auto-saved</span>
  </div>

  <form id="profile-form">
    <div class="form-grid">
      <div class="form-group">
        <label>First Name</label>
        <input type="text" id="firstName" name="firstName" placeholder="Sanjay">
      </div>
      <div class="form-group">
        <label>Last Name</label>
        <input type="text" id="lastName" name="lastName" placeholder="Surya">
      </div>
      <div class="form-group full">
        <label>Email Address</label>
        <input type="email" id="email" name="email" placeholder="sanjaysurya3010@gmail.com">
      </div>
      <div class="form-group">
        <label>Phone / Mobile</label>
        <input type="tel" id="phone" name="phone" placeholder="+91 9876543210">
      </div>
      <div class="form-group">
        <label>Current City / Location</label>
        <input type="text" id="city" name="city" placeholder="Bengaluru, India">
      </div>
      <div class="form-group full">
        <label>LinkedIn URL</label>
        <input type="url" id="linkedin" name="linkedin" placeholder="https://linkedin.com/in/sanjaysurya">
      </div>
      <div class="form-group full">
        <label>GitHub URL</label>
        <input type="url" id="github" name="github" placeholder="https://github.com/sanjvj">
      </div>
      <div class="form-group full">
        <label>Portfolio / Website</label>
        <input type="url" id="portfolio" name="portfolio" placeholder="https://winter-arc-c2def.web.app">
      </div>
      <div class="form-group">
        <label>Degree / Qualification</label>
        <input type="text" id="degree" name="degree" placeholder="B.Tech Computer Science">
      </div>
      <div class="form-group">
        <label>University / College</label>
        <input type="text" id="college" name="college" placeholder="Anna University">
      </div>
      <div class="form-group">
        <label>Graduation Year</label>
        <input type="text" id="gradYear" name="gradYear" placeholder="2025">
      </div>
      <div class="form-group">
        <label>CGPA / Percentage</label>
        <input type="text" id="cgpa" name="cgpa" placeholder="8.5">
      </div>
      <div class="form-group">
        <label>Total Experience (Yrs)</label>
        <input type="text" id="experienceYears" name="experienceYears" placeholder="0">
      </div>
      <div class="form-group">
        <label>Notice Period</label>
        <input type="text" id="noticePeriod" name="noticePeriod" placeholder="Immediate">
      </div>
      <div class="form-group">
        <label>Expected CTC (LPA)</label>
        <input type="text" id="expectedCTC" name="expectedCTC" placeholder="12 LPA">
      </div>
      <div class="form-group">
        <label>Current CTC</label>
        <input type="text" id="currentCTC" name="currentCTC" placeholder="Fresher">
      </div>
      <div class="form-group">
        <label>Authorized in India?</label>
        <select id="authorizedInIndia" name="authorizedInIndia">
          <option value="Yes">Yes</option>
          <option value="No">No</option>
        </select>
      </div>
      <div class="form-group">
        <label>Need Sponsorship?</label>
        <select id="sponsorshipNeeded" name="sponsorshipNeeded">
          <option value="No">No</option>
          <option value="Yes">Yes</option>
        </select>
      </div>
    </div>

    <button id="save-btn" class="save-btn" type="submit">Save Profile Updates</button>
  </form>

  <div class="footer-links">
    <a href="https://winter-arc-c2def.web.app" target="_blank">Open Winter Arc Command Center ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
